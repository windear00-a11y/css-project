<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      text-align: center;
      margin: 30px 0 15px;
      font-size: 30px;
      color: #1e4ede;
    }

    .media-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .media-item {
      margin-bottom: 25px;
    }

    .media-item h2 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #1e4ede;
      border-left: 4px solid #1e4ede;
      padding-left: 10px;
    }

    audio,
    video,
    iframe {
      width: 100%;
      max-width: 100%;
      border-radius: 10px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      nav a {
        margin-left: 8px;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="logo-container">
      <a href="./index.html">
        <img src="Photo.png" alt="logo" height="25" width="25">
      </a>
      <span class="logo-text">Learn Coding</span>
    </div>

    <!--navbar section  -->
    <nav class="navbar" id="navbar">
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link">Conact</a>
      <a href="media.html" class="nav-link">Media</a>
      <!-- Success Login Button -->
      <a href="login.html" class="nav-link login-btn">Login</a>
    </nav>

    <!-- Navbar(Mobile Only) -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>
  <h1>HTML Multimedia</h1>
  <div class="media-box">
    <div class="media-item">
      <h2>Simple Audio</h2><audio src="Dard Tere Jane Ka.mp4" controls></audio>
    </div>
    <div class="media-item">
      <h2>Autoplay Audio</h2><audio src="Dard Tere Jane Ka.mp4" autoplay muted controls></audio>
    </div>
    <div class="media-item">
      <h2>Loop Audio</h2><audio src="Dard Tere Jane Ka.mp4" loop controls></audio>
    </div>
    <div class="media-item">
      <h2>Simple Video</h2><video src="VID-20260820-WA0001.mp4" controls height="300"></video>
    </div>
    <div class="media-item">
      <h2>Autoplay Video</h2><video src="VID-20260820-WA0001.mp4" autoplay muted controls></video>
    </div>
    <div class="media-item">
      <h2>Loop Video</h2><video src="VID-20260820-WA0001.mp4" loop controls></video>
    </div>
    <div class="media-item">
      <h2>Video with Poster</h2><video src="VID-20260820-WA0001.mp4" poster="Photo.png" controls></video>
    </div>
    <div class="media-item">
      <h2>Embedded YouTube Video</h2>
      <iframe width="300" height="300" src="https://www.youtube.com/embed/QcLh2UDMh3Y?si=agEKdS8KZZcWW9kZ"
        title="YouTube video player" frameborder="0" allow="
 accelerometer;
    autoplay;
    clipboard-write;
    encrypted-media;
    gyroscope;
    picture-in-picture;
    web-share;
    " referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
  <footer class="footer">
    <p class="footer-text">© 2025 | All Rights Reserved</p>
  </footer>

  <script>

        // Hamburger LOGIC
        const hmburger=document.getElementById("hamburger")
        const navbar=document.getElementById("navbar")

        hmburger.addEventListener("click",()=>{
            navbar.classList.toggle("active");
            hmburger.classList.toggle("open")
        })


        // SCROLL LOGIC
        const header=document.getElementById("header")
            window.addEventListener("scroll",()=>{
            if(window.scrollY>20){
                header.classList.add("scrolled")
            }else{
                header.classList.remove("scrolled")
            }
        })
       </script>
</body>

</html>
