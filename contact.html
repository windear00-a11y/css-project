<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      text-align: center;
      margin: 30px 0 15px;
      font-size: 32px;
      color: #1e4ede;
    }

    .content {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      margin: auto;
      font-size: 17px;
    }

    .contact-item {
      margin-bottom: 25px;
    }

    .contact-item h2 {
      margin-bottom: 8px;
      color: #1e4ede;
      border-left: 4px solid #1e4ede;
      padding-left: 10px;
    }

    a.contact-link {
      color: #1e4ede;
      font-weight: bold;
      text-decoration: none;
    }

    a.contact-link:hover {
      text-decoration: underline;
    }

    .social {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .social span {
      background: #e9e9e9;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header" id="header">
    <div class="logo-container">
      <a href="./index.html">
        <img src="Photo.png" alt="logo" height="25" width="25">
      </a>
      <span class="logo-text">Learn Coding</span>
    </div>

    <!--navbar section  -->
    <nav class="navbar" id="navbar">
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link">Conact</a>
      <a href="media.html" class="nav-link">Media</a>
      <!-- Success Login Button -->
      <a href="login.html" class="nav-link login-btn">Login</a>
    </nav>

    <!-- Navbar(Mobile Only) -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <h1>Contact Us</h1>

  <div class="content">

    <div class="contact-item">
      <h2>Email</h2>
      <a class="contact-link" href="mailto:windear.00@gmail.com" target="_blank">
        windear.00@gmail.com
      </a>
    </div>

    <div class="contact-item">
      <div>
        <h2>Phone</h2>
        <a class="contact-link" href="tele:+919876543210" target="_blank">+91 9876543210 (Call Now)</a>
      </div>
    </div>

    <div>
      <h2>Instagram</h2>
      <div>
        <span>@kulwinderbansal00</span>
        <span>@kajalkulwinder.00</span>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p class="footer-text">© 2025 | All Rights Reserved</p>
  </footer>

  <script>

              // Hamburger LOGIC
        const hmburger=document.getElementById("hamburger")
        const navbar=document.getElementById("navbar")

        hmburger.addEventListener("click",()=>{
            navbar.classList.toggle("active");
            hmburger.classList.toggle("open")
        })

      
      //scroll logic
      const header=document.getElementById("header")
            window.addEventListener("scroll",()=>{
            if(window.scrollY>20){
                header.classList.add("scrolled")
            }else{
                header.classList.remove("scrolled")
            }
        })
        </script>
</body>

</html>
